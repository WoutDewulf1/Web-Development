<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondriaan</title>
    <link rel="stylesheet" href="style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXD/VNfK7A/w2k2T9F/8" crossorigin="anonymous">
</head>
<body>
<div class="container my-5">

    <div id="mondriaan-grid-wrapper" class="row gx-0">

        <div class="col-4 d-flex flex-column gx-0">
            <div class="mondriaan-block" id="a">A</div>
            <div class="mondriaan-block" id="b">B</div>
            <div class="mondriaan-block" id="d">D</div>
        </div>

        <div class="col-8 d-flex flex-column gx-0">
            <div class="mondriaan-block" id="c">C</div>

            <div class="row gx-0">
                <div class="col-9 mondriaan-block" id="e">E</div>

                <div class="col-3 d-flex flex-column gx-0">
                    <div class="mondriaan-block" id="f">F</div>
                    <div class="mondriaan-block" id="g">G</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
